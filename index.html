 ${bk.length?`<h3>Copias de seguridad</h3>${bk.map(x=>`<div class=nt><span class=ni>💾</span><span class=nx><b>${esc(x.m)}</b><small>${x.f} · ${x.h}</small></span>${X(`delN('${x.id}')`)}</div>`).join('')}`:''}

function snap(label){const L=SNAPS().filter(x=>label||x.l||x.f!==today()),x={f:today(),t:new Date().toISOString(),n:db.b.length,d:JSON.parse(JSON.stringify(db))};if(label)x.l=label;

 let d;try{d=JSON.parse(await f.text())}catch(e){return bkBad('El archivo no es una copia válida.')}
 const x=d&&d.db&&Array.isArray(d.db.b)?d.db:d&&Array.isArray(d.b)?d:null,
  ok=x&&x.b.every(b=>b&&typeof b.id==='string'&&typeof b.n==='string'&&['ins','herr'].includes(b.t)&&Array.isArray(b.p)&&Array.isArray(b.mov)&&b.p.every(q=>q&&typeof q.id==='string'&&typeof q.n==='string'));
 if(!ok)return bkBad('El archivo no tiene el formato de una copia de este inventario. No se cambió nada.');
 const it=x.b.reduce((a,b)=>a+b.p.length,0);
 if(!confirm(`Se reemplazarán TODOS los datos actuales (${db.b.length} bodegas) por los de la copia (${x.b.length} bodegas, ${it} ítems${d.fecha?', del '+String(d.fecha).slice(0,10):''}). ¿Continuar?`))return;
 snap('Antes de importar');x.b.forEach(b=>{b.cf=Array.isArray(b.cf)?b.cf:[]});db=x;cur=null;save();render();

function render(){const h=$('#h'),m=$('#m');
 if(cfg){h.style.display='none';h.innerHTML='';m.innerHTML=vCfg();chkNew();return}

  m.innerHTML=homeV();doS();return}

function vRes(b){
 const r=b.p.map(p=>{const s=stock(b,p),w=CF(b).filter(x=>x.c[p.id]!=null).pop(),low=p.min>0&&s<=p.min;
  return `<tr class="${low?'low':''}"><td>${esc(p.n)} <small>(${p.u||'unidad'})</small>${low?' ⚠️':''}<td>${+(p.ini+tot(b,p,'in')).toFixed(2)}<td>${tot(b,p,'out')}<td><b>${s}</b><td>${w?`${w.c[p.id]} <small>(${w.f})</small>`:'–'}<td>${ed(p.id)}${trb(`delP('${p.id}')`)}</tr>`}).join('');
 return `${formE(b)}${formP(b)}<div class=sc><table><tr><th>Producto<th>Inicial + reposiciones<th>Retirado<th>Stock actual<th>Últ. conteo<th></tr>${r}</table></div>
 <p class=mu>⚠️ = stock igual o bajo el mínimo definido.</p>`}

// Conteo físico: lo contado es lo que queda; la diferencia contra el stock anterior se registra como retiro
const CF=b=>[...(b.cf||[])].sort((x,y)=>(x.f+x.h).localeCompare(y.f+y.h)),cmin=(p,c)=>p.min>0&&c<=p.min,
 ret=(b,c,p)=>+b.mov.filter(m=>m.cid===c.id&&m.p===p.id&&m.t==='out').reduce((a,m)=>a+m.q,0).toFixed(2);
function vCnt(b){
 if(!b.p.length)return EMPTY;
 const cf=CF(b),last=cf[cf.length-1];let est='';
 if(last){
  const rows=b.p.map(p=>{const c=last.c[p.id];if(c==null)return '';const low=cmin(p,c),falta=Math.max(0,+(p.ini-c).toFixed(2));
   return `<tr class="${low?'low':''}"><td>${esc(p.n)} <small>(${p.u||'unidad'})</small>${low?' ⚠️ Reponer':''}<td><b>${c}</b><td>${ret(b,last,p)}<td>${tot(b,p,'out')}<td>${p.min>0?p.min:'–'}<td>${falta}</tr>`}).join('');
  const cards=`<div class=sc><table><tr><th>Producto<th>Quedan<th>Retirado en este conteo<th>Retirado total<th>Mínimo<th>Para completar</tr>${rows}</table></div>`;
  const hist=cf.slice(-6),mat=`<div class=sc><table><tr><th>Producto${hist.map(x=>`<th>${x.f}`).join('')}</tr>${b.p.map(p=>`<tr><td>${esc(p.n)}${hist.map(x=>{const c=x.c[p.id],r=c==null?0:ret(b,x,p);return `<td>${c==null?'–':c}${r?` <small>(−${r})</small>`:''}`}).join('')}</tr>`).join('')}</table></div>`;
  est=`<h3>Lo que queda · conteo del ${last.f}</h3>${cards}<small class=mu>Para completar = cantidad inicial − lo que queda.</small>
  <div class=noprint><button class=ghost onclick="tab='rep';msg='';render()">➕ Ir a Reposición</button></div>
  ${cf.length>1?`<h3>Historial de conteos <small>(entre paréntesis lo retirado)</small></h3>${mat}`:''}`}
 const form=`<h3>${last?'Hacer un nuevo conteo':'Hacer el primer conteo'}</h3><form onsubmit="addC(event)">
 ${b.p.map(p=>{const l=last&&last.c[p.id];return `<div class=row><span class=g>${esc(p.n)} <small>(${p.u||'unidad'})${l!=null?` · último: ${l}`:''}</small></span><input type=number min=0 step=any class=cc data-p="${p.id}" placeholder="Cuántos hay" required></div>`}).join('')}
 <button class=big>Guardar conteo</button></form><p class=mu>Cuenta lo que hay físicamente. Se guarda con la fecha de hoy (${today()}) y la app calcula lo retirado desde el conteo anterior. Si cuentas dos veces el mismo día, el último reemplaza al anterior.</p>`;
 return msg+est+form+(last?'<button class=ghost onclick="delC()">Eliminar último conteo</button>':'')}
function addC(e){e.preventDefault();const b=B(),f=today(),c={};
 document.querySelectorAll('.cc').forEach(i=>c[i.dataset.p]=+i.value);
 b.cf=b.cf||[];const old=b.cf.find(x=>x.f===f);if(old){b.mov=b.mov.filter(m=>m.cid!==old.id);b.cf=b.cf.filter(x=>x!==old)}
 const id=uid(),h=hh();
 b.p.forEach(p=>{const d=+(c[p.id]-stock(b,p)).toFixed(2);
  if(d<0)b.mov.push({id:uid(),f,h,p:p.id,t:'out',q:-d,r:'Conteo físico',o:'Retiro calculado por conteo',cid:id});
  else if(d>0)b.mov.push({id:uid(),f,h,p:p.id,t:'in',q:d,r:'Ajuste por conteo',o:'',cid:id})});
 b.cf.push({id,f,h,c});save();
 const low=b.p.filter(p=>cmin(p,c[p.id]));
 msg=low.length?`<div class="ban bad"><b>⚠️ Para reponer (en o bajo el mínimo):</b><ul>${low.map(p=>`<li>${esc(p.n)}: quedan ${c[p.id]} (mínimo ${p.min})</li>`).join('')}</ul></div>`:'<div class="ban ok">✅ Conteo guardado. Todo está sobre el mínimo.</div>';
 render();scrollTo(0,0)}
function delC(){const b=B(),w=CF(b);if(w.length&&confirm('¿Eliminar el último conteo y los retiros calculados con él?')){const l=w[w.length-1];b.mov=b.mov.filter(m=>m.cid!==l.id);b.cf=b.cf.filter(x=>x!==l);msg='';save();render()}}

function vRepo(b){
 if(!b.p.length)return EMPTY;
 const rows=b.mov.filter(m=>m.t==='in').sort((x,y)=>key(y).localeCompare(key(x))).slice(0,60).map(m=>`<tr><td>${m.f} ${m.h}<td>${esc(pn(b,m.p))}<td>+${m.q}<td>${m.cid?'':trb(`delM('${m.id}')`)}</tr>`).join('');
 return `<form onsubmit="addR(event)"><div class=row><select id=rp>${b.p.map(p=>`<option value="${p.id}">${esc(p.n)} (stock ${stock(b,p)})</option>`).join('')}</select><input id=rq type=number min=0 step=any placeholder="Cantidad repuesta" required><button>Registrar</button></div></form>
 <p class=mu>La fecha se guarda sola (hoy: ${today()}). La reposición, 1 vez al mes, se suma al stock inicial.</p>
 <div class=sc><table><tr><th>Fecha<th>Producto<th>Cantidad<th></tr>${rows}</table></div>`}

const formP=b=>{const h=b.t==='herr';return `<form class=row onsubmit="addP(event)"><input id=pn placeholder="${h?'Herramienta':'Producto'}" required><select id=pu><option value=unidad>Unidad</option><option value=kit>Kit</option></select>${h?'<input id=pi placeholder="Cantidad (ej: 5 o Varios)" required><input id=pl placeholder="📍 ¿Dónde está guardado? (ej: Estante 3)">':'<input id=pi type=number min=0 step=any placeholder="Cant. inicial" required><input id=pm type=number min=0 step=any placeholder="Mínimo (opcional)">'}<button>Agregar</button></form>`};
function vResH(b){
 const r=b.p.map(p=>`<tr><td>${esc(p.n)} <small>(${p.u||'unidad'})</small>${p.l?`<br><small>📍 ${esc(p.l)}</small>`:''}<td><b>${qd(b,p)}</b><td>${trb(`delP('${p.id}')`)}</tr>`).join('');
 return `${formP(b)}<div class=sc><table><tr><th>Herramienta<th>Total<th></tr>${r}</table></div>
 <p class=mu>Para agregar, quitar, cambiar nombre, ubicación o cantidad usa Ajustes (queda registrado con su motivo).</p>`}
function vAj(b){
 if(!b.p.length)return '<p class=mu>Agrega herramientas primero en Resumen.</p>';
 const run=runMap(b),rows=b.mov.map(m=>({k:key(m),h:`<tr><td>${m.f} ${m.h}<td>${esc(pn(b,m.p))}<td>${m.t==='in'?'+':'−'}${m.q}<td>${esc(m.o)}<td>${run[m.id]}<td>${trb(`delM('${m.id}')`)}</tr>`})).concat((b.tl||[]).map(t=>({k:t.f+t.h,h:`<tr><td>${t.f} ${t.h}<td>${esc(pn(b,t.p))}<td>${tlT(t)}<td>${esc(t.o)}<td>–<td></tr>`}))).sort((x,y)=>y.k.localeCompare(x.k)).slice(0,80).map(x=>x.h).join('');
 return `<form onsubmit="addA(event)"><div class=row><select id=ap>${b.p.map(p=>`<option value="${p.id}">${esc(p.n)} (total ${qd(b,p)})</option>`).join('')}</select><select id=at onchange="tg()"><option value=out>Quitar (se ocupó / falta)</option><option value=in>Agregar (llegó / devuelto)</option><option value=ren>Cambiar nombre</option><option value=loc>Cambiar ubicación</option><option value=cq>Cambiar cantidad (número o texto)</option></select><input id=aq type=number min=0 step=any placeholder="Cantidad" required><input id=an placeholder="Nuevo nombre" style="display:none"></div>
 <div class=row><input id=ao placeholder="Motivo: ¿por qué o para qué se ocupó?" required></div><button class=big>Registrar ajuste</button></form>
 <p class=mu>La fecha y la hora se guardan solas. El motivo queda anotado para saber por qué falta algo.</p>
 <div class=sc><table><tr><th>Fecha<th>Herramienta<th>Cambio<th>Motivo<th>Quedó<th></tr>${rows}</table></div>`}
function tg(){const t=$('#at').value,x=['ren','loc','cq'].includes(t);$('#aq').style.display=x?'none':'';$('#aq').required=!x;const a=$('#an');a.style.display=x?'':'none';a.required=x;a.placeholder={ren:'Nuevo nombre',loc:'Nueva ubicación (dónde está guardado)',cq:'Nueva cantidad (número o texto, ej: Varios)'}[t]||''}
function addA(e){e.preventDefault();const b=B(),p=b.p.find(x=>x.id===$('#ap').value),t=$('#at').value,o=$('#ao').value.trim(),lg=x=>(b.tl=b.tl||[]).push({id:uid(),f:today(),h:hh(),p:p.id,o,...x});
 if(t==='ren'){const n=$('#an').value.trim();if(!n)return;lg({rn:[p.n,n]});p.n=n;save();render();return}
 if(t==='loc'){const n=$('#an').value.trim();if(!n)return;lg({lc:[p.l||'—',n]});p.l=n;save();render();return}
 if(t==='cq'){const raw=$('#an').value.trim();if(!raw)return;const old=p.txt?p.txt:String(stock(b,p));
  if(/^\d+([.,]\d+)?$/.test(raw)){const N=+raw.replace(',','.'),d=+(N-stock(b,p)).toFixed(2);if(d)b.mov.push({id:uid(),f:today(),h:hh(),p:p.id,t:d>0?'in':'out',q:Math.abs(d),r:'',o});if(p.txt){lg({cq:[old,String(N)]});delete p.txt}}
  else{lg({cq:[old,raw]});p.txt=raw}
  save();render();return}
 if(p.txt){alert(`La cantidad de esta herramienta está en texto ("${p.txt}"). Usa "Cambiar cantidad" para modificarla.`);return}
 const q=+$('#aq').value,s=stock(b,p);
 if(!(q>0))return;if(t==='out'&&q>s){alert(`Solo hay ${s}`);return}
 b.mov.push({id:uid(),f:today(),h:hh(),p:p.id,t,q,r:'',o});save();render()}

const PE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',

const formE=b=>{const p=b.p.find(x=>x.id===editing);if(!p)return '';const h=b.t==='herr';
 return `<form class=card style="cursor:default" onsubmit="saveE(event)"><b>Editar: ${esc(p.n)}</b>
 <div class=row><input id=en value="${esc(p.n)}" required><select id=eu><option value=unidad ${p.u!=='kit'?'selected':''}>Unidad</option><option value=kit ${p.u==='kit'?'selected':''}>Kit</option></select></div>
 <div class=row><label>${h?'Total':'Cant. inicial'} <input id=ei type=number min=0 step=any value="${p.ini}" required></label>${h?'':`<label>Mínimo <input id=em type=number min=0 step=any value="${p.min||0}"></label>`}</div>

function editP(id){editing=id;render();scrollTo(0,0)}
function saveE(e){e.preventDefault();const b=B(),p=b.p.find(x=>x.id===editing),n=+$('#ei').value,o=$('#eo').value.trim();
 if(n!==p.ini){if(stock(b,p)+n-p.ini<0){alert('La cantidad no puede quedar por debajo de lo ya retirado');return}
  if(!o){alert('Indica el motivo del cambio de cantidad');return}
  (b.tl=b.tl||[]).push({id:uid(),f:today(),h:hh(),p:p.id,a:p.ini,n,o});p.ini=n}
 p.n=$('#en').value.trim();p.u=$('#eu').value;if($('#em'))p.min=+$('#em').value||0;editing=null;save();render()}
const tlH=(b,mo)=>{const r=(b.tl||[]).filter(t=>t.f>=mo+'-01'&&t.f<=mo+'-31').map(t=>`<tr><td>${t.f}<td>${esc(pn(b,t.p))}<td>${tlT(t)}<td>${esc(t.o)}</tr>`).join('');
 return r?`<h3>Cambios de cantidad inicial</h3><table><tr><th>Fecha<th>Producto<th>Cantidad<th>Motivo</tr>${r}</table>`:''};
function repHerr(b,mo){const s=mo+'-01',e=mo+'-31',run=runMap(b),inM=m=>m.f>=s&&m.f<=e;
 const d=b.p.map(p=>{const ms=b.mov.filter(m=>m.p===p.id&&inM(m)).sort((x,y)=>key(x).localeCompare(key(y))),q=t=>+ms.filter(m=>m.t===t).reduce((a,m)=>a+m.q,0).toFixed(2),h=stockAt(b,p,e);
  return {p,ms,qo:q('out'),qi:q('in'),h,f:Math.max(0,+(p.ini-h).toFixed(2))}});
 const sum=d.map(x=>`<tr><td>${esc(x.p.n)} <small>(${x.p.u||'unidad'})</small><td>${x.p.txt?esc(x.p.txt):+(x.h+x.qo-x.qi).toFixed(2)}<td>${x.p.txt?'–':x.qo}<td>${x.p.txt?'–':x.qi}<td><b>${x.p.txt?esc(x.p.txt):x.h}</b><td>${esc(x.p.l||'')}</tr>`).join('');
 const det=d.filter(x=>x.ms.length).map(x=>`<h3>${esc(x.p.n)}</h3><table><tr><th>Fecha<th>Hora<th>Cambio<th>Motivo<th>Quedó</tr>${x.ms.map(m=>`<tr><td>${m.f}<td>${m.h}<td>${m.t==='in'?'+':'−'}${m.q}<td>${esc(m.o)}<td>${run[m.id]}</tr>`).join('')}</table>`).join('')||'<p><small>No hay ajustes en este mes.</small></p>';
 const tl=(b.tl||[]).filter(inM).map(t=>`<tr><td>${t.f}<td>${esc(pn(b,t.p))}<td>${tlT(t)}<td>${esc(t.o)}</tr>`).join('');
 return `<div class=rp><h2>${esc(b.n)}</h2><small>Informe de herramientas · ${mo} · generado el ${today()}</small>
 <h3>Estado de la bodega</h3><table><tr><th>Herramienta<th>Total al inicio<th>Quitado en el mes<th>Agregado en el mes<th>Total al cierre<th>Ubicación</tr>${sum}</table>
 <h3>Detalle de ajustes y motivos</h3>${det}${tl?`<h3>Cambios de nombre, ubicación y cantidad</h3><table><tr><th>Fecha<th>Herramienta<th>Cambio<th>Motivo</tr>${tl}</table>`:''}</div>`}
const entH=(b,mo)=>{const r=b.mov.filter(m=>m.t==='in'&&m.f>=mo+'-01'&&m.f<=mo+'-31').sort((x,y)=>key(x).localeCompare(key(y))).map(m=>`<tr><td>${m.f}<td>${m.h}<td>${esc(pn(b,m.p))}<td>+${m.q}<td>${esc(m.r)}</tr>`).join('');
 return `<h3>Detalle de reposiciones</h3>${r?`<table><tr><th>Fecha<th>Hora<th>Producto<th>Cantidad<th>Detalle</tr>${r}</table>`:'<p><small>No hay reposiciones en este mes.</small></p>'}`};
const rep2=(b,mo)=>b.t==='herr'?repHerr(b,mo):repHTML(b,mo);
function repHTML(b,mo){const s=mo+'-01',e=mo+'-31',run=runMap(b);
 const sm=(p,t,fn)=>b.mov.filter(m=>m.p===p.id&&m.t===t&&fn(m)).reduce((a,m)=>a+m.q,0);
 const d=b.p.map(p=>{const i0=p.ini+sm(p,'in',m=>m.f<s)-sm(p,'out',m=>m.f<s),re=sm(p,'in',m=>m.f>=s&&m.f<=e),
  outs=b.mov.filter(m=>m.p===p.id&&m.t==='out'&&m.f>=s&&m.f<=e).sort((x,y)=>key(x).localeCompare(key(y))),to=outs.reduce((a,m)=>a+m.q,0);
  return {p,re:+re.toFixed(2),ini:+(i0+re).toFixed(2),outs,to:+to.toFixed(2),fin:+(i0+re-to).toFixed(2)}});
 const sum=d.map(x=>`<tr><td>${esc(x.p.n)}<td>${x.re}<td>${x.ini}<td>${x.outs.length}<td>${x.to}<td><b>${x.fin}</b></tr>`).join('');

 return `<div class=rp><h2>${esc(b.n)}</h2><small>Informe de retiros · ${mo} · generado el ${today()}</small>
